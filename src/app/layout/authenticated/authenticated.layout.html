<section class="flex h-screen overflow-hidden bg-linear-to-br from-gray-50 to-blue-50">
  <aside
    [class.-translate-x-full]="!sidebarOpen()"
    class="fixed inset-y-0 left-0 w-64 bg-white border-r border-slate-200 shadow-2xl transform md:translate-x-0 md:relative transition-transform duration-300 ease-in-out z-30"
  >
    <div
      class="flex items-center justify-center h-16 border-b border-slate-200 font-extrabold text-blue-700 text-2xl tracking-tight"
    >
      Shorti.fy
    </div>

    <nav class="mt-6 px-4 overflow-y-auto flex-1">
      <div>
        <h3 class="px-4 text-slate-400 uppercase tracking-widest text-xs font-semibold mb-3">
          Main
        </h3>

        <ul class="space-y-1">
          <li class="flex md:hidden">
            <a
              [routerLink]="'/profile'"
              routerLinkActive="bg-blue-100 text-blue-900"
              [routerLinkActiveOptions]="{ exact: true }"
              class="flex w-full flex-col px-4 py-3 rounded-xl hover:bg-blue-50 transition"
            >
              <p class="font-semibold text-blue-800">{{ myAccount().fullName }}</p>
              <small class="text-slate-500">View your profile</small>
            </a>
          </li>

          @for (nav of navigations; track nav.name) {
            <li>
              <a
                [routerLink]="nav.url"
                routerLinkActive="bg-blue-100 text-blue-900 shadow-sm"
                [routerLinkActiveOptions]="{ exact: true }"
                [ngClass]="{ 'bg-blue-100 text-blue-900 shadow-sm': isActive(nav.url) }"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-medium hover:bg-blue-50 hover:text-blue-800 transition-all duration-200"
              >
                <ng-icon [name]="nav.icon" class="w-5 h-5 text-blue-500 shrink-0"></ng-icon>

                <span>{{ nav.name }}</span>
              </a>
            </li>
          }
        </ul>
      </div>

      <div class="mt-10 md:hidden block">
        <h3 class="px-4 text-slate-400 uppercase tracking-widest text-xs font-semibold mb-3">
          Actions
        </h3>

        <ul class="space-y-2">
          <li>
            <button
              (click)="confirmLogout()"
              class="w-full text-left flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 hover:text-white font-semibold hover:bg-red-500 transition"
            >
              <ng-icon name="heroArrowRightOnRectangle" class="w-5 h-5"></ng-icon>
              Logout
            </button>
          </li>
        </ul>
      </div>
    </nav>
  </aside>

  @if (sidebarOpen()) {
    <div
      (click)="toggleSidebar()"
      class="fixed inset-0 bg-black/40 backdrop-blur-sm z-20 md:hidden"
    ></div>
  }

  <div class="flex-1 flex flex-col overflow-hidden">
    <header
      class="flex items-center justify-between bg-white/90 backdrop-blur border-b border-slate-200 shadow-sm px-4 md:px-6 h-16 z-10"
    >
      <div class="flex items-center space-x-3">
        <button
          (click)="toggleSidebar()"
          class="md:hidden p-2 rounded-xl hover:bg-blue-100 transition"
        >
          <svg class="w-6 h-6 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
        <span class="text-xl font-bold text-blue-700 md:hidden">Shorti.fy</span>
      </div>

      <div #profileMenu class="relative md:flex items-center hidden">
        <button
          (click)="toggleProfileMenu()"
          class="flex items-center gap-2 px-2 py-1 rounded-full transition focus:outline-none"
        >
          <img [src]="myAccount().icon" class="w-9 h-9 rounded-full ring-2 ring-blue-200 shadow" />
          <svg class="w-4 h-4 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            ></path>
          </svg>
        </button>

        @if (profileMenuOpen()) {
          <div
            class="absolute right-0 top-0 mt-11 w-56 bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden z-50"
          >
            <div class="px-4 py-3 border-b border-slate-200 flex items-center gap-2">
              <ng-icon [name]="'heroUser'" class="w-5 h-5 text-blue-500"></ng-icon>
              <p class="font-semibold text-slate-800">
                {{ myAccount().fullName }}
              </p>
            </div>

            <a
              [routerLink]="'/profile'"
              class="flex items-center gap-2 px-4 py-3 text-slate-700 hover:bg-blue-50 hover:text-blue-800 transition font-medium"
            >
              <ng-icon [name]="'heroUserCircle'" class="w-5 h-5 text-blue-500"></ng-icon>
              Profile
            </a>

            <button
              (click)="confirmLogout()"
              class="w-full flex items-center gap-2 text-left px-4 py-3 text-red-600 hover:bg-red-50 transition font-semibold"
            >
              <ng-icon [name]="'heroArrowRightOnRectangle'" class="w-5 h-5 text-red-600"></ng-icon>
              Logout
            </button>
          </div>
        }
      </div>
    </header>

    <main class="flex-1 overflow-auto p-4 md:p-6 bg-linear-to-br from-gray-50 to-blue-50">
      <ng-content></ng-content>
    </main>
  </div>
</section>
