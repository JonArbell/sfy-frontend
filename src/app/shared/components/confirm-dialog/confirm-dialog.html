@if (confirmDialogStore.isOpen()) {
  <app-modal>
    <div class="px-6 pt-6 border-b border-gray-100">
      <h3 class="text-lg font-semibold text-slate-900">
        {{ confirmDialogStore.title() }}
      </h3>
    </div>

    <div class="px-6 py-4">
      <p class="text-sm text-slate-600 leading-relaxed">
        {{ confirmDialogStore.message() }}
      </p>
    </div>

    <div class="flex justify-end gap-3 px-6 pb-6">
      <button class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700
                    hover:bg-slate-200 hover:text-slate-900 transition font-medium"
              (click)="confirmDialogStore.cancel()">
        {{ confirmDialogStore.cancelButtonText() }}
      </button>

      <button class="px-4 py-2 rounded-lg bg-red-600 text-white
                    hover:bg-red-500 hover:shadow-lg transition font-semibold"
              (click)="confirmDialogStore.confirm()">
        {{ confirmDialogStore.confirmButtonText() }}
      </button>
    </div>
  </app-modal>
}
